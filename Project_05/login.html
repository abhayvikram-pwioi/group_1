<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowboard Login</title>

<link rel="stylesheet" href="login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="left">

        <h1>FLOWBOARD</h1>

        <h2>Welcome Back 👋</h2>

        <p>
            Manage projects, collaborate with your team,
            and keep your workflow organized.
        </p>

    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Login</h2>

            <div class="inputBox">
                <label>Workspace ID</label>
                <input
                type="text"
                id="workspaceId"
                placeholder="FLOW-AB12CD"
                required>
            </div>

            <div class="inputBox">
                <label>Email</label>
                <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required>
            </div>

            <div class="inputBox passwordBox">

                <label>Password</label>

                <input
                type="password"
                id="password"
                placeholder="********"
                required>

                <i
                class="fa-solid fa-eye"
                id="togglePassword"></i>

            </div>

            <div class="options">

                <label>

                    <input
                    type="checkbox"
                    id="remember">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">

                Login

            </button>

            <p class="register">

                Don't have a workspace?

                <a href="createWorkspace.html">

                    Create Workspace

                </a>

            </p>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
