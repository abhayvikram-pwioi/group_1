<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="/cssFiles/news.css">
</head>
<body>
    <main class="news-detail">
        <button id="back-btn">← Back</button>
        <div class="news-meta">
            <span>Technology</span>
            <span>•</span>
            <span>5 min read</span>
        </div>
        <h1 id="news-title">Headline goes here</h1>
        <div class="author">
            By John Doe • June 14, 2026
        </div>
        <img src="" alt="" id="news-img">
        <div class="summary-card">
            <h3>Quick Summary</h3>
            <p>
                2-3 lines summary of articles
            </p>
        </div>
        <article id="news-content">
            Full article content.....
        </article>
        <section id="related-news">
            <h2>Related News</h2>
        </section>

    </main>
</body>
</html>
