<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="/cssFiles/news.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

         <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>

</head>
<body>
    <main class="news-detail">
        <button id="back-btn">← Back</button>
        <div class="news-meta">
            <span id="category">Technology</span>
            <span>•</span>
            <span id="news-page-time">5 min read</span>
        </div>
        <h1 id="news-page-title">Headline goes here</h1>
        <div class="author">
            <span id="news-page-brand">John Doe</span>
            <span>•</span>
            <span id="news-page-date"> June 14, 2026</span>
        </div>
        <img src="" alt="" id="news-page-img">
        <div class="summary-card">
            <h3>Quick Summary</h3>
            <p id="news-page-summary">
                2-3 lines summary of articles
            </p>
        </div>
        <article id="news-page-content">
            Full article content.....
        </article>
        <section id="related-news">
            <h2>Related News</h2>
            <div id="related-news-container">

            </div>
        </section>

    </main>
    
    <footer>
            <div class="foot-up">
                <div class="foot-links">
                    <a href="">About Us</a>
                    <a href="">Advertise With Us</a>
                    <a href="">Privacy Policy</a>
                    <a href="">Contact Us</a>
                </div>
                <div class="social-links">
                    <a href=""><i class="fa-brands fa-instagram"></i></a>
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-x-twitter"></i></a>
                </div>
            </div>
            <div class="foot">
                <p>Data provided by OpenWeather API & NewsAPI</p>
                <p>© 2026 Aggregator. All rights reserved.</p>
            </div>
        </footer>

    <script src="/jsFiles/news.js"></script>
</body>
</html>
