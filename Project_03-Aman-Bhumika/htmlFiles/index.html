<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/cssFiles/style.css">
</head>
<body>
    <main class="main-section">

        <header>
            <div class="logo-sec">
                <img src="" alt="logo">
                <h1>News and Weather</h1>
            </div>
            <div class="header-right-sec">
                <input type="search" id="searchNews">
                <select name="" id="newsCategory">
                    <option value="">Trending News</option>
                    <option value="technology">Technology</option>
                    <option value="sports">Sports</option>
                    <option value="health">Health</option>
                    <option value="bussiness">Bussiness</option>
                    <option value="entertainment">Entertainment</option>
                </select>
            </div>
        </header>

        <div class="greeting-sec">
            <div class="greeting-msg">
                <h1>Good Morning</h1>
                <p>Your personalized command center for global weather and industry insights.</p>
            </div>
            <div class="date-time">
                <h3>Wed, 10 June</h3>
                <h3>10:00 AM</h3>
            </div>

        </div>
        <div class="cards-section">
            <div class="weather-sec">

            </div>

            <div class="news-sec">

            </div>
        </div>

        <hr>
    
        <footer>
            <p>Data provided by OpenWeather API & NewsAPI</p>
            <p>© 2026 Aggregator. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
