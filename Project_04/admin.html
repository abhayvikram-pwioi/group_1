        <!-- Add Event -->
        <section class="add-event">
            <h2>Add New Event</h2>
            <form id="eventForm">
                <input type="text" id="title" placeholder="Event Name" required>
                <input type="date" id="date" required>
                <input type="time" id="time" required>
                <input type="text" id="venue" placeholder="Venue" required>
                <select id="category">
                    <option>Select Category</option>
                    <option>Technical</option>
                    <option>Cultural</option>
                    <option>Workshop</option>
                    <option>Arts & Cultural</option>
                    <option>Music & Entertainment</option>
                    <option>Health & Wellness</option>
                </select>
                <input type="number" id="seats"  placeholder="Available Seats" required>
                <input type="url" id="image" placeholder="Banner Image URL">
                <textarea placeholder="Event Description" id="description" required></textarea>
                <button type="submit" id="submitBtn">Add Event</button>
            </form>
        </section>
        

        <section class="recent-events">

    <div class="events-header">
        <h2>All Events</h2>
    </div>

    <input type="text" id="search" placeholder="Search Events">
