<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main class="product-page">
        <header></header>
        <div class="main-sec">
            <div class="filter-sec">
                <div class="filter-head-up">
                    <h2>Filters</h2>
                    <button id="filter-clear-btn"><a>clear</a></button>
                </div>
                <div class="filter-list">
                    <h3>Category</h3>

                    <label>
                        <input type="checkbox" value="Electronics">
                        Electronics
                    </label>

                    <label>
                        <input type="checkbox" value="Fashion">
                        Fashion
                    </label>

                    <label>
                        <input type="checkbox" value="Gaming">
                        Gaming
                    </label>

                    <label>
                        <input type="checkbox" value="Shoes">
                        Shoes
                    </label>

                    <label>
                        <input type="checkbox" value="Accessories">
                        Accessories
                    </label>

                </div>
                <div class="filter-down">
                    <div class="price-filter">
                        <h3>Price Range</h3>

                        <input type="range" min="0" max="50000" value="30000" id="priceSlider">
                        <div class="price-values">
                            <span>₹0</span>
                            <span id="priceValueMax">₹30,000</span>
                        </div>

                    </div>

                    <div class="filter-sort">
                        <h3>Sort By</h3>

                        <select id="sort-topics">
                            <option>Popularity</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                        </select>

                    </div>

                    <div class="filter-rating">
                        <h4>Ratings</h4>
                        <div class="rating-list">
                            <p>4+ star</p>
                            <p>3+ star</p>
                            <p>2+ star</p>
                        </div>
                    </div>

                </div>

            </div>

            <div class="Product-sec">
                <h1>All Products</h1>
            </div>
        </div>
    </main>
</body>

</html>
