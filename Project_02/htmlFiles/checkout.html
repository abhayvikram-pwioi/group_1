<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link rel="stylesheet" href="/cssFiles/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <main class="checkout-page">
        <header class="page-header">
            <div class="page-logo">
                <a href="home.html">Shop-verse</a>
            </div>
            <nav class="category">
                <a href="/htmlFiles/home.html" class="res-show">Home</a>
                <a href="/htmlFiles/product-page.html" class="res-show">Product</a>
                <a href="/htmlFiles/wishlist.html" class="res-hide">Wishlist</a>
            </nav>

            <div class="page-search">
                <input type="text" placeholder="Search products..." width="100px">
                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>
            <nav class="page-icon">

                <a href="wishlist.html" class="wishlist-icon">
                    <i class="fa-regular fa-heart"></i>
                    <span id="wishlist-count">0</span>
                </a>
                <a href="#"><i class="fa-regular fa-circle-user"></i></a>
                <a href="cart.html" class="cart-icon" id="cart-zone">
                    <i class="fa-solid fa-cart-arrow-down"></i>
                    <span id="cart-count">0</span>
                </a>
            </nav>
        </header>

        <section class="main-container">

            <div class="left-section">

                <div class="box">

                    <h2>Shipping Address</h2>

                    <div class="form-grid">

                        <div>
                            <label>
                                Full Name
                                <span class="required">*</span>
                            </label>

                            <input type="text" id="name" placeholder="Enter Full Name">
                        </div>

                        <div>
                            <label>
                                Email
                                <span class="required">*</span>
                            </label>

                            <input type="email" id="email" placeholder="Enter Email">
                        </div>

                        <div>
                            <label>
                                Phone Number
                                <span class="required">*</span>
                            </label>

                            <input type="tel" id="phone" maxlength="10" placeholder="Enter Phone Number">
                        </div>

                        <div>
                            <label>
                                Address
                                <span class="required">*</span>
                            </label>

                            <input type="text" id="address" placeholder="Enter Address">
                        </div>

                        <div>
                            <label>
                                City
                                <span class="required">*</span>
                            </label>

                            <input type="text" id="city" placeholder="Enter City">
                        </div>

                        <div>
                            <label>State</label>

                            <input type="text" id="state" placeholder="Enter State">
                        </div>

                        <div>
                            <label>
                                Pincode
                                <span class="required">*</span>
                            </label>

                            <input type="text" id="pincode" maxlength="6" placeholder="Enter Pincode">
                        </div>

                        <div>
                            <label>Country</label>

                            <input type="text" value="India" readonly>
                        </div>

                    </div>

                </div>

                <div class="box payment-box">

                    <h2>Payment Method</h2>

                    <div class="payment-option">
                        <input type="radio" name="payment" value="Card">
                        Credit / Debit Card
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment" value="UPI">
                        UPI
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment" value="NetBanking">
                        Net Banking
                    </div>

                    <div class="payment-option">
                        <input type="radio" name="payment" value="COD">
                        Cash On Delivery
                    </div>

                </div>

                <button class="order-btn">
                    Place Order
                </button>

            </div>

            <div class="right-section">

                <div class="summary-box">

                    <h2>Order Summary</h2>

                    <div id="product-list"></div>

                    <div class="checkout-totals" id="checkout-totals">
                    </div>

                    <div class="grand-total">
                        <span>Total Amount</span>
                        <h2 id="totalPrice">₹0</h2>
                    </div>

                </div>

            </div>

        </section>
    </main>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/JsFiles/checkout.js"></script>

</body>

</html>
