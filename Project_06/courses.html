<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="courses.css">
    <title>Courses</title>
</head>
<body>
    <main class="courses-page">

   
    <section class="page-header">
        <div class="heading">
            <h1>My Courses</h1>
            <p>Track your enrolled courses and learning progress.</p>
        </div>
    </section>


<section class="course-controls">

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search courses..."
        >
    </div>
    

    <div class="filter-buttons">

        <button class="filter-btn active" data-filter="All">
            All
        </button>

        <button class="filter-btn" data-filter="Completed">
            Completed
        </button>

        <button class="filter-btn" data-filter="In Progress">
            In Progress
        </button>

        <button class="filter-btn" data-filter="Not Started">
            Not Started
        </button>

    </div>

</section>

   
    <section class="courses-grid">

    </section>

</main>

<script type="module" src="courses.js"></script>
</body>
</html>
