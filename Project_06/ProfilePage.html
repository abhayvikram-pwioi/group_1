<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="ProfilePage.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <p class="logo">LearnTrack</p>
      <h1>Student Profile</h1>
    </div>
  </header>

  <main class="container">
    <!-- Student details are added from script.js -->
    <section class="profile-section" aria-labelledby="student-name">
      <div id="profile-content"></div>
    </section>

    <section class="section" aria-labelledby="information-heading">
      <h2 id="information-heading">Student Information</h2>
      <div class="info-grid" id="student-information"></div>
    </section>

    <section class="section" aria-labelledby="progress-heading">
      <h2 id="progress-heading">Progress</h2>
      <div class="progress-card" id="progress-content"></div>
    </section>

    <section class="section" aria-labelledby="statistics-heading">
      <h2 id="statistics-heading">Statistics</h2>
      <div class="statistics-grid" id="statistics-content"></div>
    </section>

    <section class="section" aria-labelledby="skills-heading">
      <h2 id="skills-heading">Skills</h2>
      <div class="skills-box" id="skills-content"></div>
    </section>

    <div class="bottom-grid">
      <!-- <section class="section list-section" aria-labelledby="activity-heading">
        <h2 id="activity-heading">Recent Activity</h2>
        <ul id="activity-list"></ul>
      </section> -->

      <!-- <section class="section list-section" aria-labelledby="modules-heading">
        <h2 id="modules-heading">Pending Modules</h2>
        <ul id="module-list"></ul>
      </section> -->
    </div>
  </main>

  <script src="ProfilePage.js"></script>
</body>
</html>
